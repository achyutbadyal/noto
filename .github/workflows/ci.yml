name: ci

# Runs only when something that can change the build changes (docs, screenshots, icons and the other
# workflow do not). Pushes build main only; branch work is covered by its pull request, so a PR branch is
# not built twice.
on:
  push:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - tools/**
      - scripts/**
      - Noto.sln
      - Directory.Build.props
      - global.json
      - mise.toml
      - .config/**
      - .editorconfig
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - src/**
      - tests/**
      - tools/**
      - scripts/**
      - Noto.sln
      - Directory.Build.props
      - global.json
      - mise.toml
      - .config/**
      - .editorconfig
      - .github/workflows/ci.yml

# Least privilege: jobs only read the repository; artifacts upload with the run's own token.
permissions:
  contents: read

# A newer push to the same PR supersedes the old run. Runs on main are never cancelled, so every
# main commit still gets its tests and installers.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    # Linux only. macOS and Windows run in ci-platforms.yml when OS-specific code changes.
    name: build + test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Linux native libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools libnotify-bin xvfb
      - run: dotnet build Noto.sln
      # Headless under Xvfb so the X11 hotkey and Avalonia headless tests have a display.
      # Screenshot renders are excluded: they assert only that a frame appeared, and CI sets no
      # NOTO_SCREENSHOTS, so they would cost a full window layout each and prove nothing.
      - run: xvfb-run -a dotnet test Noto.sln --no-build --filter 'Category!=Screenshots'

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - run: dotnet tool restore && dotnet csharpier check .

  # Installers. Each runner packages its own platform natively — a macOS .app can only be assembled on
  # macOS — and uploads the result as a downloadable artifact. Runs on main only: a pull request runs the
  # tests above and stops there, so it never publishes an installer.
  package:
    name: package (${{ matrix.os }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26: FoundationModels (the on-device AI helper) needs the macOS 26 SDK.
          - os: macos-26
            rid: osx-arm64
            artifact: noto-macos-arm64
            file: dist/noto-macos-arm64.zip
          - os: ubuntu-latest
            rid: linux-x64
            artifact: noto-linux-x64
            file: dist/noto-linux-x64.tar.gz
          - os: windows-latest
            rid: win-x64
            artifact: noto-windows-win-x64
            file: dist/noto-windows-win-x64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      # Mirrors `mise run publish:*` (see mise.toml), so the artifact you download is the same file those
      # tasks produce locally.
      - name: Publish self-contained
        run: dotnet publish src/Noto.Desktop -c Release -r ${{ matrix.rid }} --self-contained -o dist/noto-desktop
      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        # `ditto` preserves the bundle's permissions and metadata; plain `zip` would not.
        env:
          REQUIRE_AI_HELPER: "1"
        run: |
          ./scripts/package_mac.sh
          ditto -c -k --keepParent dist/Noto.app dist/noto-macos-arm64.zip
      - name: Package Linux tarball
        if: runner.os == 'Linux'
        env:
          TARGET_RID: ${{ matrix.rid }}
        run: ./scripts/package_linux.sh
      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/noto-desktop/* -DestinationPath dist/noto-windows-win-x64.zip -Force
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
          if-no-files-found: error
          retention-days: 14
