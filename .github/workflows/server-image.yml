name: server-image

on:
  push:
    branches: [main]
    # Only what the Dockerfile COPYs (Directory.Build.props, Noto.Core, Noto.Sync, Noto.Server).
    paths:
      - Directory.Build.props
      - src/Noto.Core/**
      - src/Noto.Sync/**
      - src/Noto.Server/**
      - .github/workflows/server-image.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (defaults to sha-<short sha>)
        required: false
        type: string

# Least privilege: the job only reads the repository; Docker Hub auth comes from secrets.
permissions:
  contents: read

# Serialise runs so two pushes to main cannot race on the `latest` tag.
concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: yuanzix/noto-server

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: linux/arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          # push to main: latest + sha-<short>; manual run: the supplied tag, or sha-<short> if empty.
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name == 'push' || inputs.tag == '' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: src/Noto.Server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
